<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>مستودع الملفات</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--p:#131F38;--p2:#1A2A48;--line:#22324F;--ink:#F8FAFC;--mute:#94A3B8;--gray:#64748B;--blue:#3B82F6;--blue2:#2563EB;--danger:#F87171}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5;font-size:15px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:start}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--p2);border:1px solid var(--line);min-height:42px;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue2)}
.lnk{color:var(--blue);text-decoration:underline;text-align:center}
.fld{display:flex;align-items:center;gap:10px;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;color:var(--mute)}
.fld:focus-within{border-color:var(--blue)}
.fld input,.mf input,.mf textarea,.mf select{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card .lg{height:92px;width:auto;margin:4px auto 0}
.card h1{font-size:2.2rem;font-weight:700;line-height:1.2}
.card h1 b,.brand b{color:var(--blue)}
.card .fld{text-align:start}
.err{color:var(--danger);min-height:1.4em;font-size:.9rem}
.eye{display:grid;place-items:center;color:var(--mute)}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--p);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;padding:0 8px 18px}
.brand img{height:38px;width:auto}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mute);width:100%}
.nv:hover{background:var(--p2);color:var(--ink)}
.nv.on{background:#1D3A72;color:var(--blue)}
.main{padding:20px 24px 40px;min-width:0}
.top{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.srch{flex:1;min-width:0;max-width:420px;margin-inline-end:auto}
.srch input{width:100%}
.av{width:42px;height:42px;border-radius:50%;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;text-align:center;overflow:hidden;padding:0;flex:none}
.av:hover{border-color:var(--blue)}
.av img,.pfav img{width:100%;height:100%;object-fit:cover;display:block}
.dov{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;justify-content:flex-start;z-index:40}
.dp{width:min(340px,88vw);height:100%;background:var(--p);border-inline-end:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.dp .mh h3{font-size:1.1rem}
.pfw{position:relative;width:116px;height:116px;margin:4px auto 0;flex:none}
.pfav{width:116px;height:116px;border-radius:50%;background:var(--p2);border:2px solid var(--blue);display:grid;place-items:center;font-size:2.9rem;font-weight:700;overflow:hidden;padding:0;color:var(--ink)}
.pfbd{position:absolute;bottom:2px;inset-inline-end:2px;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:3px solid var(--p);pointer-events:none}
.pfbd .i{width:16px;height:16px}
.pff{display:flex;flex-direction:column;gap:6px;text-align:start}
.pff>span{font-size:.85rem;color:var(--mute)}
.pff input{background:var(--p2);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 12px;color:var(--ink);font:inherit;outline:0;width:100%;min-width:0}
.pff input:focus{border-color:var(--blue)}
.pff input.un{direction:ltr;text-align:start;unicode-bidi:plaintext}
.pfe{color:var(--danger);font-size:.88rem;min-height:1.2em;text-align:start}
.pfb{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.pfb .btn{justify-content:center;width:100%}
.pfb .btn:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:no-preference){.dp{animation:slL .2s ease-out}[dir=rtl] .dp{animation-name:slR}@keyframes slL{from{transform:translateX(-100%)}}@keyframes slR{from{transform:translateX(100%)}}}
.hero{position:relative;padding:26px 0 6px}
.hero .g{font-size:1.15rem;color:var(--mute)}
.hero h2{font-size:1.8rem;margin-bottom:16px;max-width:60%;word-break:break-word}
.hero .btns{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
.hero .art{position:absolute;inset-inline-end:0;top:6px;width:190px;height:auto}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 12px}
.ttl{display:flex;align-items:center;gap:8px;min-width:0}
.ttl h2{font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{display:flex;gap:8px}
.sel select{background:var(--p);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:.85rem;min-height:38px}
ul{list-style:none;padding:0;background:var(--p);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.rb{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 14px}
.rb:hover:not(:disabled){background:var(--p2)}
.bd{flex:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:.62rem;font-weight:700;color:#fff;direction:ltr;overflow:hidden}
.bd.fo{background:none}
.bd.fo svg{width:40px;height:34px}
.inf{min-width:0}
.nm{unicode-bidi:plaintext;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{color:var(--mute);font-size:.8rem}
.dots{padding:12px 14px;color:var(--mute);min-height:60px}
.dots:hover{color:var(--ink)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.foot{margin-top:18px;text-align:center;color:var(--gray);font-size:.8rem}
.drag{outline:2px dashed var(--blue);outline-offset:-8px}
/* menu + modal */
.menu{position:fixed;z-index:60;background:var(--p2);border:1px solid var(--line);border-radius:12px;min-width:160px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--p)}
.menu .dng{color:var(--danger)}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.7);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;z-index:40}
.md{width:100%;min-width:0;max-width:420px;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:1.1rem}
.mf{min-width:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--mute)}
.mf input,.mf textarea,.mf select{flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);resize:vertical}
.mf input:focus,.mf textarea:focus,.mf select:focus{border-color:var(--blue)}
.mf2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf2 .btn{justify-content:center}
.pill{display:inline-flex}
.pill img{display:block;height:40px;width:auto}
.cn{font-size:.95rem;font-weight:700;direction:ltr;text-align:center;letter-spacing:.2px;line-height:1.35;text-wrap:balance}
.co{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.cot{display:none;align-items:center;gap:10px;margin-inline-end:auto}
.cot .pill img{height:26px}
.cot .cn{font-size:.8rem;text-align:start}
.cob{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cob .pill img{height:36px}
#printArea{display:none}
@media print{
 html,body{height:auto!important;background:#fff!important;color:#000!important}
 body>*{display:none!important}
 body>#printArea{display:block!important}
 #printArea .pg{break-after:page}#printArea .pg:last-child{break-after:auto}
 #printArea img{display:block;max-width:100%;max-height:250mm;margin:0 auto}
 #printArea pre{white-space:pre-wrap;word-break:break-word;font:14px/1.7 system-ui,"IBM Plex Sans Arabic",sans-serif;color:#000}
}
.chk{min-width:0;display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.chk label{min-width:0;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;color:var(--ink);cursor:pointer}
.chk label:hover{background:var(--p2)}
.chk input{flex:none;width:18px;height:18px;padding:0;border:0;background:none;accent-color:var(--blue)}
.chk span{flex:1;unicode-bidi:plaintext;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .brand,#out,.co{display:none}
 .cot{display:flex}
 nav{flex-direction:row;justify-content:space-around}
 .nv{flex-direction:column;gap:2px;font-size:.7rem;padding:7px 4px;text-align:center;align-items:center}
 .main{padding:calc(14px + env(safe-area-inset-top,0px)) 14px 96px}
 .top{flex-wrap:wrap}
 .srch{order:3;flex:1 1 100%;max-width:none;margin:0}
 .hero .art{display:none}.hero h2{max-width:100%}
}
@media(prefers-reduced-motion:no-preference){.ov{animation:f .15s}@keyframes f{from{opacity:0}}}
.gbtn{background:#fff;color:#1f1f1f;border-color:#fff;justify-content:center;font-weight:600}
.gbtn:hover{border-color:var(--blue)}
.who{display:flex;align-items:center;gap:12px;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start}
.who b{display:block}.who small{color:var(--mute);direction:ltr;unicode-bidi:plaintext;display:block}
.avs{width:42px;height:42px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avs img,.pfav img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:18px;inset-inline:16px;margin:auto;width:max-content;max-width:90vw;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;z-index:60}
.md.adm{max-width:900px;height:min(86vh,720px);overflow:hidden}
.adm .ab{overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tb{padding:9px 14px;border-radius:8px 8px 0 0;color:var(--mute)}
.tb.on{color:var(--ink);border-bottom:2px solid var(--blue)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tw table{border-collapse:collapse;width:100%;font-size:.88rem}
.tw th,.tw td{padding:8px 10px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
.tw td{unicode-bidi:plaintext}
.tw th{background:var(--p2);color:var(--mute);font-weight:500;position:sticky;top:0}
.tw tr.clk{cursor:pointer}.tw tr.clk:hover td{background:var(--p2)}
.cbar{display:flex;gap:8px;flex-wrap:wrap}
.cbar select,.cin{background:var(--p2);border:1px solid var(--line);border-radius:10px;min-height:42px;padding:0 10px;color:var(--ink);font:inherit;flex:1;min-width:140px}
.newc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--p2);border:1px solid var(--blue);border-radius:12px;padding:12px}
.big{font-size:1.5rem;letter-spacing:.12em;direction:ltr;font-family:ui-monospace,Menlo,monospace}
.mini{color:var(--danger);padding:2px 8px}
.sm{font-size:.8rem}
.err{color:var(--danger)}
</style>
</head>
<body>

<main id="auth" hidden></main>

<div id="app" hidden>
  <aside>
    <div class="co"><span class="pill"><img class="colg" alt=""></span><b class="cn"></b></div>
    <div class="brand"><img class="mkS" alt=""><span id="brand"></span></div>
    <nav id="nav"></nav>
    <button class="nv" id="out"></button>
  </aside>
  <div class="main" id="main">
    <header class="top">
      <div class="cot"><span class="pill"><img class="colg" alt=""></span><b class="cn"></b></div>
      <label class="fld srch" id="srchbox"><span id="srchic"></span><input id="q" type="search"></label>
      <button class="av" id="av"></button>
    </header>
    <section class="hero" id="hero">
      <img class="art mkL" alt="">
      <div class="g" id="greet"></div>
      <h2 id="uname"></h2>
      <div class="btns">
        <button class="btn pri" id="bUp"></button>
        <button class="btn" id="bFold"></button>
        <button class="btn" id="bNote"></button>
        <button class="btn" id="bPrint"></button>
      </div>
    </section>
    <div class="rowh">
      <div class="ttl"><button id="back" hidden></button><h2 id="h2"></h2></div>
      <div class="sel"><select id="sort"></select><select id="cat"></select></div>
    </div>
    <ul id="list"></ul>
    <p class="foot" id="foot"></p>
    <input type="file" id="file" multiple hidden>
  </div>
</div>

<div id="printArea"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

function authShell(inner,again){

}
function showAuth(msg,mode="login"){
  const T=t(),su=mode==="signup";
  authShell(`<p class="mute">${su?T.signSub:T.gSub2}</p>`
    +(su?`<label class="fld">${ic("user")}<input id="a_name" placeholder="${T.fullname}" autocomplete="name"></label>`:"")
    +`<label class="fld">${ic("user")}<input id="a_email" type="email" placeholder="${T.email}" autocomplete="email" dir="ltr"></label>`
    +`<label class="fld">${ic("lock")}<input id="a_pass" type="password" placeholder="${T.pass}" autocomplete="${su?"new-password":"current-password"}" dir="ltr"></label>`
    +(su?`<label class="fld">${ic("lock")}<input id="a_pass2" type="password" placeholder="${T.confirm}" autocomplete="new-password" dir="ltr"></label>`:"")
    +`<p class="err" id="a_err" role="alert"></p><button class="btn pri" id="a_go" style="justify-content:center">${su?T.signup:T.login}</button><button class="lnk" id="a_sw">${su?T.haveAcc:T.newAcc}</button>`,()=>showAuth(msg,mode));
  const er=$("#a_err");if(msg)er.textContent=msg;
  if(!sb)er.textContent=T.noSb;
  $("#a_sw").onclick=()=>showAuth("",su?"login":"signup");
  const go=async()=>{
    if(!sb)return;er.textContent="";
    const em=$("#a_email").value.trim(),pw=$("#a_pass").value;
    const nm=su?$("#a_name").value.trim():"";
    if(!em||!pw||(su&&!nm))return er.textContent=T.fill;
    if(su){if(pw.length<6)return er.textContent=T.short;if(pw!==$("#a_pass2").value)return er.textContent=T.mism}
    const b=$("#a_go");b.disabled=true;
    let r;
    try{
      r=su?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    }catch(e){r={error:e}}
    b.disabled=false;
    if(r.error){
      const m=errMsg(r.error);
      if(/invalid login/i.test(m))return er.textContent=T.bad;
      if(/already registered|already been registered/i.test(m))return er.textContent=T.exists;
      if(/email not confirmed/i.test(m))return er.textContent=T.confirmEm;
      return er.textContent=m;
    }
    if(su&&!r.data.session){
      if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length)return er.textContent=T.exists;
      return er.textContent=T.confirmEm;
    }
    await start();
  };
  $("#a_go").onclick=go;
  $("#auth").onkeydown=e=>{if(e.key==="Enter")go()};
  (su?$("#a_name"):$("#a_email")).focus();
}

const rowToItem=r=>({id:r.id,kind:r.kind,name:r.name,parent:r.parent||"",size:Number(r.size)||0,added:Number(r.added)||0,cat:r.cat,mime:r.mime||"",trashed:!!r.trashed,by:r.added_by_name||""});

const chunk=(a,n=80)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
async function upd(ids,patch){for(const c of chunk(ids)){const {error}=await sb.from("items").update(patch).in("id",c);if(error)throw error}}
const kids=id=>{const r=[],w=p=>items.filter(i=>i.parent===p).forEach(i=>{r.push(i);w(i.id)});w(id);return r};
const byId=id=>items.find(i=>i.id===id);

async function putFile(blob,name,mime){

async function setTrash(it,v){

  }catch(e){fail(e)}

async function purge(it){

    const all=[it,...kids(it.id)],files=all.filter(i=>i.kind==="file").map(i=>i.id);

function openPrint(){

  modal(T.print,[{k:"ids",label:T.pickPrint,type:"checks",opts:fl.map(f=>[f.id,f.name])}],T.print,v=>{if(!v.ids.length)return false;printFiles(v.ids.map(byId))});

async function printFiles(list){
  const T=t(),pdf=[],ok=[],bad=[];
  for(const f of list){
    const ty=f.mime||"",e=extOf(f.name).toLowerCase();
    if(ty==="application/pdf"||e==="pdf")pdf.push(f);
    else if(ty.startsWith("image/")||/^(jpe?g|png|gif|webp|svg|bmp)$/.test(e))ok.push([f,"img"]);
    else if(ty.startsWith("text/")||/^(txt|md|csv|json|log)$/.test(e))ok.push([f,"txt"]);
    else bad.push(f.name);
  }
  const wins=pdf.map(()=>window.open("","_blank"));
  if(bad.length)alert(T.noPrint+"\n"+bad.join("\n"));
  if(pdf.length||ok.length)logAct("print",[...pdf,...ok.map(x=>x[0])].map(f=>f.name).join(" | "));
  try{
    for(let i=0;i<pdf.length;i++){const b=await getBlob(pdf[i]),u=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));if(wins[i])wins[i].location.href=u;else saveBlob(b,pdf[i].name)}
    if(!ok.length)return;
    const pa=$("#printArea"),urls=[],waits=[];pa.textContent="";
    for(const [f,k] of ok){
      const b=await getBlob(f),pg=document.createElement("div");pg.className="pg";
      if(k==="img"){const im=document.createElement("img"),u=URL.createObjectURL(b);urls.push(u);waits.push(new Promise(r=>{im.onload=im.onerror=r}));im.src=u;pg.append(im)}
      else{const pre=document.createElement("pre");pre.dir="auto";pre.textContent=await b.text();pg.append(pre)}
      pa.append(pg);
    }
    await Promise.all(waits);
    const done=()=>{pa.textContent="";urls.forEach(u=>URL.revokeObjectURL(u));removeEventListener("afterprint",done)};
    addEventListener("afterprint",done);
    window.print();
  }catch(e){wins.forEach(w=>w&&w.close());fail(e)}
}

}
function row(it){
  const T=t(),li=document.createElement("li"),tr=view==="trash";
  const rb=document.createElement("button");rb.className="rb";rb.disabled=tr;
  let bd;
  if(it.kind==="folder")bd='<div class="bd fo"><svg viewBox="0 0 24 20"><path d="M1 3a2 2 0 0 1 2-2h6l2 2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#3B82F6"/></svg></div>';
  else{const e=extOf(it.name).toLowerCase();bd=`<div class="bd" style="background:${COL[e]||(it.cat==="img"?"#10B981":"#64748B")}">${(e||"file").slice(0,4).toUpperCase()}</div>`}
  rb.innerHTML=bd+'<div class="inf"><div class="nm"></div><div class="mt"></div></div>';
  rb.querySelector(".nm").textContent=it.name;
  rb.querySelector(".mt").textContent=it.kind==="folder"?`${T.folder} • ${items.filter(i=>i.parent===it.id&&!i.trashed).length} ${T.items} • ${fmtDate(it.added)}`:`${(extOf(it.name)||"FILE").toUpperCase()} • ${fmtSize(it.size)} • ${fmtDate(it.added)}`+(it.by?" • "+it.by:"");
  rb.onclick=()=>openIt(it);
  const d=document.createElement("button");d.className="dots";d.innerHTML=ic("dots");d.setAttribute("aria-label","menu");
  d.onclick=e=>{e.stopPropagation();menu(d,tr?[[T.rest,()=>setTrash(it,false)],[T.delf,()=>purge(it),1]]:[...(it.kind==="folder"?[[T.open,()=>openIt(it)]]:[[T.dl,()=>download(it)],[T.print,()=>printFiles([it])]]),[T.edit,()=>editItem(it)],[T.del,()=>setTrash(it,true),1]])};
  li.append(rb,d);return li;
}
function render(){
  const T=t(),q=$("#q").value.trim();
  document.querySelectorAll(".nv[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("#hero").hidden=!(view==="home"&&!q);
  $("#greet").hidden=$("#uname").hidden=!!cur;$(".hero .art").toggleAttribute("hidden",!!cur);
  $("#hero").style.paddingTop=cur?"8px":"";
  const fo=cur&&byId(cur);
  $("#h2").textContent=view==="home"?(fo?fo.name:T.my):T[view];
  $("#back").hidden=!(view==="home"&&cur);
  const a=list(),ul=$("#list");ul.textContent="";
  if(!a.length){const e=document.createElement("li");e.className="empty";e.style.display="block";e.textContent=q||$("#cat").value?T.noRes:view==="trash"?T.emptyT:T.empty;ul.append(e)}
  else a.forEach(i=>ul.append(row(i)));
}
function setLang(){
  const T=t(),r=document.documentElement;
  r.lang=lang;r.dir=lang==="ar"?"rtl":"ltr";document.title=T.title;
  $("#brand").innerHTML=`${T.t1} <b>${T.t2}</b>`;
  $("#nav").innerHTML="";
  for(const [v,i] of [["home","home"],["all","files"],["recent","clock"],["trash","trash"]]){
    const b=document.createElement("button");b.className="nv";b.dataset.v=v;b.innerHTML=ic(i)+`<span>${T[v]}</span>`;
    b.onclick=()=>{view=v;if(v==="home")cur="";$("#q").value="";render()};$("#nav").append(b);
  }
  if(user&&user.role==="admin"){const b=document.createElement("button");b.className="nv";b.innerHTML=ic("user")+`<span>${T.admin}</span>`;b.onclick=()=>openAdmin();$("#nav").append(b)}
  $("#out").innerHTML=ic("out")+`<span>${T.out}</span>`;
  $("#srchic").innerHTML=ic("search");$("#q").placeholder=T.search;
  document.querySelectorAll(".cn").forEach(e=>e.textContent=T.co);
  $("#bUp").innerHTML=ic("upload")+T.up;$("#bFold").innerHTML=ic("nf")+T.nf;$("#bNote").innerHTML=ic("note")+T.an;$("#bPrint").innerHTML=ic("print")+T.print;
  $("#back").innerHTML=ic("back","flip");$("#back").setAttribute("aria-label",T.back);
  const s=$("#sort").value,c=$("#cat").value;
  $("#sort").innerHTML=[["new",T.sNew],["old",T.sOld],["name",T.sName],["size",T.sSize]].map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
  $("#sort").value=s||"new";
  $("#cat").innerHTML=`<option value="">${T.cAll}</option>`+catOpts().map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
  $("#cat").value=c||"";
  $("#sort").setAttribute("aria-label",T.sort);$("#cat").setAttribute("aria-label",T.cat);
  $("#foot").textContent=T.note;
  if(user){$("#greet").textContent=new Date().getHours()<12?T.g0:T.g1;$("#uname").textContent=user.name;updateAv()}
  if(ready)render();
}
async function logout(){
  let was=false;try{was=sessionStorage.getItem("fv_in")==="1";sessionStorage.removeItem("fv_in")}catch(e){}
  if(was&&user&&user.active)await sb.rpc("log_action",{p_action:"logout",p_target:""}).then(()=>{},()=>{});
  if(ch&&sb){sb.removeChannel(ch);ch=null}
  ready=false;user=null;items=[];cur="";view="home";
  if(sb)await sb.auth.signOut();
  showAuth();
}
async function enter(){
  $("#auth").hidden=true;$("#app").hidden=false;
  setLang();
  try{await load()}catch(e){fail(e)}
  ready=true;render();
  let fl=false;try{fl=sessionStorage.getItem("fv_in")==="1"}catch(e){}
  if(!fl){try{sessionStorage.setItem("fv_in","1")}catch(e){}logAct("login")}
  subscribe();
}
addEventListener("pagehide",()=>{
  let fl=false;try{fl=sessionStorage.getItem("fv_in")==="1";sessionStorage.removeItem("fv_in")}catch(e){}
  if(!fl||!sess||!user||!user.active)return;
  fetch(SB_URL+"/rest/v1/rpc/log_action",{method:"POST",keepalive:true,headers:{apikey:SB_KEY,Authorization:"Bearer "+sess.access_token,"Content-Type":"application/json"},body:JSON.stringify({p_action:"logout",p_target:""})}).catch(()=>{});
});

/* ---------- events ---------- */
$("#q").oninput=render;$("#sort").onchange=render;$("#cat").onchange=render;
$("#bUp").onclick=()=>$("#file").click();$("#bFold").onclick=newFolder;$("#bNote").onclick=newNote;$("#bPrint").onclick=openPrint;
$("#file").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
$("#back").onclick=()=>{const f=byId(cur);cur=f?f.parent:"";render()};
$("#out").onclick=logout;
$("#av").onclick=e=>{e.stopPropagation();openProfile()};
const mn=$("#main");
["dragenter","dragover"].forEach(ev=>mn.addEventListener(ev,e=>{e.preventDefault();mn.classList.add("drag")}));
["dragleave","drop"].forEach(ev=>mn.addEventListener(ev,e=>{e.preventDefault();mn.classList.remove("drag")}));
mn.addEventListener("drop",e=>{if(view!=="trash")addFiles([...e.dataTransfer.files])});

/* ---------- start ---------- */
document.querySelectorAll("img.colg").forEach(i=>i.src=LOGO);
document.querySelectorAll("img.mkL").forEach(i=>i.src=MARK_L);document.querySelectorAll("img.mkS").forEach(i=>i.src=MARK_S);
{const fi=document.querySelector("link[rel=icon]");if(fi)fi.href=MARK_F}
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=t().title;
if(sb)sb.auth.onAuthStateChange((ev,s)=>{sess=s});
start().then(()=>{if(location.hash.includes("access_token")||location.search.includes("code="))history.replaceState(null,"",location.pathname)});
</script>
</body>
